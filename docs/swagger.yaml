basePath: /
definitions:
  execution.Execution:
    properties:
      attempt_number:
        type: integer
      duration_ms:
        type: integer
      finished_at:
        type: string
      http_status:
        description: '*int para permitir valor nil, omite o campo se for nil'
        type: integer
      id:
        type: string
      job_id:
        type: string
      response_body:
        description: truncado em 2KB
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/execution.Status'
      triggered_at:
        type: string
    type: object
  execution.Status:
    enum:
    - success
    - failed
    - timeout
    type: string
    x-enum-varnames:
    - StatusSuccess
    - StatusFailed
    - StatusTimeout
  handler.AgentChatRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/handler.GeminiMessage'
        type: array
      message:
        example: crie um job para rodar a cada 5 minutos batendo em https://httpbin.org/get
        type: string
    type: object
  handler.AgentChatResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/handler.GeminiMessage'
        type: array
      reply:
        example: "Executando ferramenta createJob... Job criado com ID 4a82 com sucesso!
          \U0001F680"
        type: string
    type: object
  handler.AuthResponse:
    properties:
      apiKey:
        type: string
      projects:
        items:
          $ref: '#/definitions/handler.ProjectResponse'
        type: array
      token:
        $ref: '#/definitions/handler.TokenResponse'
      user:
        $ref: '#/definitions/handler.UserResponse'
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handler.GeminiFunctionCall:
    properties:
      args:
        additionalProperties: {}
        type: object
      id:
        type: string
      name:
        type: string
    type: object
  handler.GeminiFunctionResponse:
    properties:
      id:
        type: string
      name:
        type: string
      response:
        additionalProperties: {}
        type: object
    type: object
  handler.GeminiMessage:
    properties:
      parts:
        items:
          $ref: '#/definitions/handler.GeminiPart'
        type: array
      role:
        type: string
    type: object
  handler.GeminiPart:
    properties:
      functionCall:
        $ref: '#/definitions/handler.GeminiFunctionCall'
      functionResponse:
        $ref: '#/definitions/handler.GeminiFunctionResponse'
      text:
        type: string
      thoughtSignature:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.ProjectResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      userId:
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  handler.SignupRequest:
    properties:
      cpf:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      project_name:
        type: string
    type: object
  handler.SugestaoValor:
    properties:
      label:
        type: string
      valor:
        type: string
    type: object
  handler.TokenResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  handler.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      plan:
        type: string
    type: object
  job.HTTPMethod:
    enum:
    - GET
    - POST
    type: string
    x-enum-varnames:
    - MethodGet
    - MethodPost
  job.Job:
    properties:
      consecutive_failures:
        type: integer
      created_at:
        type: string
      headers:
        additionalProperties:
          type: string
        description: '{"Content-Type": "application/json"}'
        type: object
      http_method:
        $ref: '#/definitions/job.HTTPMethod'
      id:
        type: string
      last_run_at:
        description: se nunca rodou, é nil
        type: string
      name:
        type: string
      next_job_id:
        type: string
      next_run_at:
        type: string
      payload:
        additionalProperties: {}
        description: corpo JSON
        type: object
      project_id:
        type: string
      schedule:
        type: string
      status:
        $ref: '#/definitions/job.Status'
      tags:
        items:
          type: string
        type: array
      timezone:
        description: '"AMERICA/Sao_Paulo", "UTC", etc'
        type: string
      updated_at:
        type: string
      url:
        type: string
      webhook_alert_url:
        description: URL para callbacks de sucesso/falha
        type: string
    type: object
  job.Status:
    enum:
    - active
    - paused
    - failing
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusPaused
    - StatusFailing
  postgres.APIKey:
    properties:
      createdAt:
        type: string
      id:
        type: string
      prefix:
        type: string
      projectId:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API do sistema CronFlow para agendamento e monitoramento de execução
    de tarefas distribuídas em background.
  title: CronFlow API
  version: "1.0"
paths:
  /health:
    get:
      description: Retorna o status de saúde da aplicação, conectividade com o banco
        de dados Postgres, cache Redis e informações de versão do build.
      produces:
      - application/json
      responses:
        "200":
          description: API operacional e banco conectado
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Banco de dados ou Redis indisponível
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verificar saúde da API
      tags:
      - Health
  /v1/agent/chat:
    post:
      consumes:
      - application/json
      description: Envia uma mensagem para o Agente de IA, permitindo agendar jobs,
        testar cURLs, consultar histórico ou gerenciar tarefas por linguagem natural.
      parameters:
      - description: Histórico e nova mensagem do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AgentChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Resposta do Agente de IA e histórico atualizado
          schema:
            $ref: '#/definitions/handler.AgentChatResponse'
        "400":
          description: Payload inválido ou sem mensagem
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erros na API do Gemini/Groq ou durante a execução de ferramentas
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Conversar com o Agente de IA do CronFlow
      tags:
      - AI Agent
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Envia um link de recuperação de senha por e-mail (Mockado nos logs
        do console em desenvolvimento).
      parameters:
      - description: E-mail do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: E-mail enviado ou simulado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Solicitar redefinição de senha
      tags:
      - Autenticação
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário usando e-mail e senha, retornando os tokens
        JWT e a lista de projetos associados.
      parameters:
      - description: Credenciais de login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Autenticado com sucesso
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: E-mail ou senha ausentes
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Credenciais inválidas
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno de autenticação
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Realizar login
      tags:
      - Autenticação
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Valida o token recebido por e-mail e atualiza a senha do usuário.
      parameters:
      - description: Token de redefinição e nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Senha redefinida com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Redefinir senha com token
      tags:
      - Autenticação
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Cria uma conta de usuário com e-mail, senha, nome completo e CPF,
        inicializando um projeto padrão e uma chave de API segura.
      parameters:
      - description: Dados de cadastro contendo e-mail, senha, nome completo, CPF
          e nome do projeto inicial
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Conta criada, projeto inicializado e chaves geradas
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: E-mail, senha, nome do projeto, nome completo ou CPF ausentes,
            ou CPF matematicamente inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: E-mail ou CPF já cadastrados por outro usuário
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno de banco ou geração de chaves
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registrar uma nova conta de desenvolvedor
      tags:
      - Autenticação
  /v1/executions:
    get:
      description: Retorna a lista paginada de todas as execuções ocorridas nos Jobs
        do projeto autenticado.
      parameters:
      - description: Número da página (padrão 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (1-100, padrão 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Dados paginados contendo data ([]execution.ProjectExecution),
            total, page, limit
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao buscar execuções globais
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar execuções globais do Projeto
      tags:
      - Executions
  /v1/jobs:
    get:
      description: Retorna todos os agendamentos de Jobs do projeto autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: Lista de jobs do projeto
          schema:
            items:
              $ref: '#/definitions/job.Job'
            type: array
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao listar jobs
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar Jobs
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      description: Cria um novo agendamento de Job para o projeto autenticado.
      parameters:
      - description: Dados para criação do Job (name, schedule, url, etc.)
        in: body
        name: job
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Job criado com sucesso
          schema:
            $ref: '#/definitions/job.Job'
        "400":
          description: Parâmetros inválidos ou corpo incorreto
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API Key não fornecida ou inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Limite de jobs do plano atingido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Criar Job
      tags:
      - Jobs
  /v1/jobs/{id}:
    delete:
      description: Remove um Job do banco de dados e limpa os agendamentos associados.
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Job deletado com sucesso
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao deletar job
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Excluir Job
      tags:
      - Jobs
    get:
      description: Retorna os detalhes de um Job específico pelo ID, desde que pertença
        ao projeto autenticado.
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detalhes do job
          schema:
            $ref: '#/definitions/job.Job'
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado ao job de outro projeto
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao buscar job
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Buscar Job por ID
      tags:
      - Jobs
    patch:
      consumes:
      - application/json
      description: Altera o status do Job entre 'active' e 'paused'.
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      - description: Novo status (active ou paused)
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "204":
          description: Status atualizado com sucesso
        "400":
          description: Status inválido ou corpo incorreto
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao atualizar status
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Atualizar Status do Job
      tags:
      - Jobs
    put:
      consumes:
      - application/json
      description: Altera os campos configuráveis de um Job (nome, cron, url, etc.).
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      - description: Campos do Job a serem atualizados
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Job atualizado com sucesso
          schema:
            $ref: '#/definitions/job.Job'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao atualizar job
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Atualizar Configurações do Job
      tags:
      - Jobs
  /v1/jobs/{id}/executions:
    get:
      description: Retorna a lista de tentativas de execução recentes de um Job específico.
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      - description: Limite de resultados (1-200, padrão 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de execuções
          schema:
            items:
              $ref: '#/definitions/execution.Execution'
            type: array
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao buscar execuções
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar execuções de um Job
      tags:
      - Executions
  /v1/jobs/{id}/trigger:
    post:
      description: Enfileira a execução de um Job de forma manual e imediata, enviando
        para o processamento em background.
      parameters:
      - description: ID do Job
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Execução manual enfileirada com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado ao job de outro projeto
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno ao enfileirar execução
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Disparar Job Imediatamente
      tags:
      - Jobs
  /v1/keys:
    get:
      description: Retorna os metadados de todas as chaves de API ativas no projeto
        (id, prefixo, data de criação). O segredo em texto claro nunca é retornado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/postgres.APIKey'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Listar API Keys
      tags:
      - API Keys
    post:
      description: Gera uma nova chave de API para o projeto. O segredo em texto claro
        é retornado apenas nesta chamada. Guarde-o em local seguro.
      produces:
      - application/json
      responses:
        "200":
          description: Nova chave criada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Criar API Key
      tags:
      - API Keys
  /v1/keys/{id}:
    delete:
      description: Revoga e exclui definitivamente uma chave de API pelo ID. Ela não
        poderá mais ser usada para autenticação.
      parameters:
      - description: ID da chave de API
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chave revogada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Revogar/Deletar API Key
      tags:
      - API Keys
  /v1/pix/qr:
    get:
      description: Retorna a string do QR Code no formato Data URI Base64 e o payload
        copia-e-cola correspondente para a chave Pix especificada e o valor solicitado.
      parameters:
      - description: 'Valor da doação (ex: 1.50, padrão 1.00)'
        in: query
        name: valor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: QR Code base64 e payload copia-e-cola
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro ao computar QR Code ou payload
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Gerar QR Code PIX Dinâmico
      tags:
      - PIX Apoio
  /v1/pix/valores:
    get:
      description: Retorna as opções rápidas e sugeridas de valores para fazer uma
        doação de apoio via PIX.
      produces:
      - application/json
      responses:
        "200":
          description: Opções sugeridas de apoio
          schema:
            items:
              $ref: '#/definitions/handler.SugestaoValor'
            type: array
        "401":
          description: Não autenticado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Listar valores sugeridos para apoio PIX
      tags:
      - PIX Apoio
securityDefinitions:
  ApiKeyAuth:
    description: Tipo "Bearer <sua-api-key>" para se autenticar.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
